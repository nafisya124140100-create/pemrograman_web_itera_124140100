<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 3 - Data Mahasiswa</title>
</head>
<body>
  <h1>Latihan 3: Data Mahasiswa</h1>

  <h2>Form Mahasiswa</h2>
  <form id="formMahasiswa">
    <input type="hidden" id="editIndex" value="-1">

    <label for="nim">NIM:</label>
    <input type="text" id="nim" required>
    <br>

    <label for="nama">Nama:</label>
    <input type="text" id="nama" required>
    <br>

    <label for="jurusan">Jurusan:</label>
    <input type="text" id="jurusan" required>
    <br>

    <label for="nilai">Nilai:</label>
    <input type="number" id="nilai" min="0" max="100" required>
    <br>

    <button type="submit" id="btnSubmit">Tambah Mahasiswa</button>
    <button type="button" id="btnCancel" hidden>Batal Edit</button>
  </form>

  <p id="infoBox" hidden></p>

  <h2>Daftar Mahasiswa</h2>
  <button type="button" id="btnTertinggi">Nilai Tertinggi</button>
  <button type="button" id="btnDiatasRata">Nilai di Atas Rata-Rata</button>
  <button type="button" id="btnSortAsc">Urutkan Nama A-Z</button>
  <button type="button" id="btnSortDesc">Urutkan Nama Z-A</button>
  <button type="button" id="btnReset">Tampilkan Semua Data</button>

  <table border="1">
    <thead>
      <tr>
        <th>No</th>
        <th>NIM</th>
        <th>Nama</th>
        <th>Jurusan</th>
        <th>Nilai</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="tabelBody"></tbody>
  </table>

  <script type="module" src="latihan3.js"></script>
</body>
</html>
